[mypy]
# Static type-checking config (issue #17).
#
# Start in permissive mode: ignore errors and report them as
# informational output. The path to tightening is:
#   1. Remove ``ignore_errors = true`` once the codebase is clean
#      enough to gate CI on mypy.
#   2. Remove individual ``[[tool.mypy.overrides]]`` entries as
#      they become clean (start with the leaf modules — config,
#      fouling_modes, spectra — and work up to ode.py / live_simulator).
#
# We do not enforce mypy in CI today; CI runs ``mypy --no-incremental
# --no-error-summary`` and prints errors as a report (not a gate).
# A contributor who adds a new file should make it type-clean from
# day one.

# Allow missing imports for libs that don't ship type stubs.
ignore_missing_imports = true

# Don't fail on errors; just report. See comment above.
ignore_errors = true

# Per-module overrides (issue #17: known dynamic patterns).
# Each block documents why the override exists; remove when the
# pattern is fixed and the module type-checks cleanly.

# fouling_modes.py: heavy use of @njit-style multi-statement lines
# and explicit type annotations on _tau etc. Should be type-clean
# once the fouling_modes classes are dataclassed properly.
[[tool.mypy.overrides]]
module = "bdsim.fouling_modes"
ignore_errors = true

# ode.py: Numba @njit kernels with no type stubs; the JIT call
# signatures are dynamic. Leave permissive until we add explicit
# stubs.
[[tool.mypy.overrides]]
module = "bdsim.ode"
ignore_errors = true

# simulation.py: per-step Numba arrays with dynamic shapes; the
# ``p.factor`` attribute is dynamically attached to Parameters and
# the solver callback types are inferred.
[[tool.mypy.overrides]]
module = "bdsim.simulation"
ignore_errors = true

# live_simulator.py: many ``self._x`` attributes are initialised in
# ``_setup()`` so mypy can't see them; the helper-imported
# ``_step_helpers`` also has dynamic types.
[[tool.mypy.overrides]]
module = "bdsim.live_simulator"
ignore_errors = true

# split_nn.py: lazy torch import — mypy sees the runtime fallback
# but not the static types. Optional-dep pattern; leave permissive.
[[tool.mypy.overrides]]
module = "bdsim.split_nn"
ignore_errors = true

# Strictness for the small leaf modules — these should type-check
# cleanly today and act as a baseline.
[[tool.mypy.overrides]]
module = [
    "bdsim.config",
    "bdsim.spectra",
    "bdsim.thermo",
    "bdsim.kinetics",
    "bdsim._step_helpers",
    "bdsim.plots",
    "bdsim.cli",
    "bdsim.fouling_modes_stepper_helpers",  # placeholder; remove if file absent
]
ignore_errors = false
