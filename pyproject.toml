[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdsim"
version = "1.2.0"
description = "Biodiesel Process Simulator — Python port of Natércia Fernandes' BDSIM (Coimbra, 2019). Faithful reimplementation of a batch biodiesel plant model with sensors, PID controllers, valve stiction, and a decanter split neural network."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Joel Sansana"},
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "scipy>=1.11",
    "torch>=2.0",
    "plotly>=6.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["bdsim*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
bdsim = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
