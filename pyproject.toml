[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bdsim"
version = "1.2.0"
description = "Biodiesel Process Simulator — Python port of Natércia Fernandes' BDSIM (Coimbra, 2019). Faithful reimplementation of a batch biodiesel plant model with sensors, PID controllers, valve stiction, and a decanter split neural network."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Joel Sansana"},
]
dependencies = [
    # Upper bounds are conservative — they're set to the major
    # version we know the fingerprint contract was calibrated
    # against. A future major-version bump (e.g. numpy 3.x, scipy
    # 2.x) may need a re-pinning rather than a silent reinstall
    # (issue #14). The exact pinned set lives in ``uv.lock``;
    # these bounds are the install-time contract.
    "numpy>=1.24,<3.0",
    "numba>=0.58,<1.0",
    "scipy>=1.11,<2.0",
    "plotly>=6.9.0,<7.0",
]

[project.optional-dependencies]
# PyTorch is only needed for the trainable DecanterSplitNet class.
# Inference-only users (run_with, LiveSimulator) do not need it —
# the split() function is a pure-NumPy reference.
torch = [
    "torch>=2.0,<3.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "torch>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["bdsim*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
bdsim = ["data/*.csv", "data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
# Scope: the bdsim project deliberately tolerates a small set of pre-existing
# ruff findings (see AGENTS.md "Ruff clean on new code"). The rules we care
# about for new code and PRs are:
#
#   E, W  — pycodestyle errors / warnings (real bugs)
#   F     — pyflakes (unused imports, undefined names)
#   I     — isort (import order)
#   B     — flake8-bugbear (likely bugs)
#   UP    — pyupgrade (modern syntax)
#
# Everything else is opt-in. Numba-kernel files (ode.py, fouling_modes.py
# parts of split_nn.py) keep their multi-statement line style and the
# resulting E702 / F841 / E401 — see AGENTS.md "Sacred hot path".
[tool.ruff]
line-length = 100
target-version = "py310"

# Per-file ignores: ode.py is the Numba RHS; the multi-statement lines look
# "unused" to ruff but the variables are read on the next statement in the
# same physical line. AGENTS.md marks these out of scope. plots.py uses
# Plotly keyword-style `dict(color=...)` heavily — rewriting to a literal is
# purely cosmetic, so we ignore C408 there too.
[tool.ruff.lint.per-file-ignores]
"bdsim/ode.py" = ["E702", "E401", "F841"]
"bdsim/plots.py" = ["C408"]
"bdsim/live_simulator.py" = ["PYI034"]  # Self return type requires Python 3.11+; we're on 3.10
"tests/*" = ["F841", "RUF059"]

[tool.ruff.lint.isort]
known-first-party = ["bdsim"]
